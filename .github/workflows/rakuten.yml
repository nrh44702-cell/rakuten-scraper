name: Rakuten Auto Post

on:
  schedule:
    # 日本時間 毎朝6時 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python rakuten_scraper.py
